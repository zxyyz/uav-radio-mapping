[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-radio-mapping"
version = "0.1.0"
description = "Lightweight UAV radio mapping and geometric building database"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
uav-map = "uav_radio_mapping.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uav_radio_mapping = ["schema.sql", "demo-buildings.json"]
